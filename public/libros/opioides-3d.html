<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tema 6 · Sistema Opioide — Libro Interactivo 3D · Acceso Docente</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070e18;
      --card: #0f1b2d;
      --border: rgba(45, 212, 191, 0.25);
      --teal: #14b8a6;
      --teal-soft: rgba(20, 184, 166, 0.14);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #10243d 0%, var(--bg) 65%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .gate-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #5eead4;
      background: var(--teal-soft);
      border: 1px solid rgba(45, 212, 191, 0.35);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.2rem;
      line-height: 1.35;
      margin: 0 0 10px;
      color: #f8fafc;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .status.is-denied {
      background: var(--danger-soft);
      border-color: rgba(248, 113, 113, 0.4);
      color: #fecaca;
    }
    .spinner {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border: 2.5px solid rgba(94, 234, 212, 0.25);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(94, 234, 212, 0.35);
      background: rgba(20, 184, 166, 0.16);
      color: #ccfbf1;
    }
    .btn-secondary {
      border-color: rgba(148, 163, 184, 0.3);
      background: transparent;
      color: var(--text);
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';
      var SESION_KEY = 'qfdos_v3_sesion';
      var statusEl = document.getElementById('gate-status');
      var spinnerEl = document.getElementById('gate-spinner');
      var msgEl = document.getElementById('gate-msg');
      var metaEl = document.getElementById('gate-meta');
      var retryBtn = document.getElementById('btn-retry');

      function showDenied(msg, detail) {
        statusEl.className = 'status is-denied';
        if (spinnerEl) spinnerEl.style.display = 'none';
        msgEl.textContent = msg;
        if (detail) metaEl.textContent = detail;
        retryBtn.style.display = 'inline-flex';
      }

      function showProgress(msg) {
        statusEl.className = 'status';
        if (spinnerEl) spinnerEl.style.display = 'inline-block';
        msgEl.textContent = msg;
      }

      function b64ToBytes(b64) {
        var norm = String(b64).trim().replace(/-/g, '+').replace(/_/g, '/');
        var pad = norm.length % 4;
        if (pad) norm += '===='.slice(0, 4 - pad);
        var bin = atob(norm);
        var out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      function leerSesionLocal() {
        try {
          var raw = localStorage.getItem(SESION_KEY);
          if (!raw) return null;
          var s = JSON.parse(raw);
          var ahora = Math.floor(Date.now() / 1000);
          if (!s || typeof s.token !== 'string' || !s.token || Number(s.caduca) <= ahora) {
            return null;
          }
          return s;
        } catch (err) {
          return null;
        }
      }

      async function gunzipToString(buf) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('Tu navegador no soporta DecompressionStream (gzip). Usa Chrome, Edge, Firefox o Safari actualizado.');
        }
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([buf]).stream().pipeThrough(ds);
        return await new Response(stream).text();
      }

      async function openBook() {
        retryBtn.style.display = 'none';
        var cfg = JSON.parse(document.getElementById('qfdos-cipher-cfg').textContent);

        if (!window.crypto || !window.crypto.subtle) {
          showDenied(
            'Web Crypto API no disponible en este contexto.',
            'Abre este recurso a través de HTTPS (GitHub Pages) o localhost.'
          );
          return;
        }

        var sesion = leerSesionLocal();
        if (!sesion) {
          showDenied(
            'Acceso denegado: inicia sesión en QFDOS con una cuenta docente verificada.',
            'No se ha encontrado ninguna sesión vigente en este navegador. Inicia sesión en la plataforma principal y vuelve a abrir este libro.'
          );
          return;
        }

        showProgress('Solicitando autorización docente al servidor…');

        var respData;
        try {
          var resp = await fetch(cfg.webappUrl + '?accion=libroClave', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ libro: cfg.bookId, sesion: sesion.token }),
            redirect: 'follow',
            cache: 'no-store'
          });
          respData = await resp.json().catch(function () { return null; });
        } catch (err) {
          showDenied(
            'No se pudo contactar con el servidor de autorización.',
            'Comprueba la conexión a internet e inténtalo de nuevo.'
          );
          return;
        }

        if (!respData || respData.ok !== true || typeof respData.clave !== 'string' || !respData.clave) {
          var serverMsg = (respData && respData.error)
            ? String(respData.error)
            : 'El servidor ha rechazado la solicitud o todavía no tiene activo el endpoint libroClave (v15).';
          var codigo = respData && respData.codigo ? 'Código: ' + respData.codigo + '. ' : '';
          showDenied(
            'Acceso denegado: ' + serverMsg,
            codigo + 'Este material es de uso exclusivo para el profesorado de QFDOS.'
          );
          return;
        }

        showProgress('Descifrando libro interactivo 3D en memoria…');

        var keyBytes;
        try {
          keyBytes = b64ToBytes(respData.clave);
          if (keyBytes.length !== 32) {
            throw new Error('Longitud de clave inválida (' + keyBytes.length + ' bytes).');
          }
          var cryptoKey = await crypto.subtle.importKey(
            'raw',
            keyBytes,
            { name: 'AES-GCM' },
            false,
            ['decrypt']
          );
          keyBytes.fill(0);
          respData.clave = '';

          var ivBytes = b64ToBytes(cfg.ivB64);
          var ctBytes = b64ToBytes(cfg.ctB64);
          var aadBytes = new TextEncoder().encode('qfdos-libro-3d:v1:' + cfg.bookId);

          var plainBuf = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: ivBytes, additionalData: aadBytes, tagLength: 128 },
            cryptoKey,
            ctBytes
          );

          var html = cfg.encoding === 'gzip'
            ? await gunzipToString(plainBuf)
            : new TextDecoder().decode(plainBuf);

          document.open();
          document.write(html);
          document.close();
        } catch (err) {
          if (keyBytes) keyBytes.fill(0);
          showDenied(
            'No se pudo descifrar el contenido del libro.',
            String(err && err.message ? err.message : err)
          );
        }
      }

      retryBtn.addEventListener('click', openBook);
      openBook();
    })();
  </script>
