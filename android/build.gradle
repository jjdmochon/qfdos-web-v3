// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // El repositorio vive en Google Drive, que bloquea ficheros mientras
    // sincroniza y rompe la compilación. La salida va al disco local.
    if (findProperty("qfdosExternalBuildDir") == "true") {
        def nombre = project.path == ":" ? "root" : project.path.substring(1).replace(":", "_")
        layout.buildDirectory = new File(System.getProperty("user.home"), ".qfdos-android-build/" + nombre)
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
